<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#05070f"/>
<stop offset="45%" stop-color="#0a0f1d"/>
<stop offset="100%" stop-color="#120820"/>
</linearGradient>
<radialGradient id="ghostGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7fffd4" stop-opacity="0.55"/>
<stop offset="45%" stop-color="#39ffb0" stop-opacity="0.18"/>
<stop offset="100%" stop-color="#39ffb0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
<stop offset="60%" stop-color="#000000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
</radialGradient>
<linearGradient id="mist" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#3ee0c8" stop-opacity="0"/>
<stop offset="50%" stop-color="#3ee0c8" stop-opacity="0.12"/>
<stop offset="100%" stop-color="#3ee0c8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="ghostBody" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#c7fff1" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#c7fff1" stop-opacity="0.02"/>
</linearGradient>
<radialGradient id="orb" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7fffd4" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

<!-- faint EMF grid lines -->
<g stroke="#1c2b3d" stroke-width="1" opacity="0.4">
<line x1="0" y1="60" x2="1200" y2="60"/>
<line x1="0" y1="130" x2="1200" y2="130"/>
<line x1="0" y1="230" x2="1200" y2="230"/>
<line x1="0" y1="300" x2="1200" y2="300"/>
<line x1="200" y1="0" x2="200" y2="360"/>
<line x1="500" y1="0" x2="500" y2="360"/>
<line x1="800" y1="0" x2="800" y2="360"/>
<line x1="1050" y1="0" x2="1050" y2="360"/>
</g>

<!-- eerie mist bands -->
<path d="M0,250 Q200,220 400,250 T800,250 T1200,250 L1200,360 L0,360 Z" fill="url(#mist)"/>
<path d="M0,290 Q300,260 600,290 T1200,290 L1200,360 L0,360 Z" fill="url(#mist)" opacity="0.7"/>

<!-- ghost glow behind figure -->
<circle cx="960" cy="180" r="180" fill="url(#ghostGlow)"/>

<!-- ghost figure silhouette on right -->
<g opacity="0.85">
<path d="M900,80
  C860,80 830,120 830,170
  C830,210 845,235 830,260
  C850,255 860,270 875,262
  C888,272 900,272 913,262
  C925,272 938,272 950,262
  C963,270 975,255 995,260
  C980,235 995,210 995,170
  C995,120 940,80 900,80 Z"
  fill="url(#ghostBody)" stroke="#7fffd4" stroke-opacity="0.4" stroke-width="1.5"/>
<circle cx="875" cy="150" r="8" fill="#08101a" opacity="0.7"/>
<circle cx="925" cy="150" r="8" fill="#08101a" opacity="0.7"/>
</g>

<!-- floating spirit orbs / dust particles -->
<circle cx="1040" cy="90" r="4" fill="url(#orb)"/>
<circle cx="1090" cy="160" r="3" fill="url(#orb)"/>
<circle cx="1010" cy="260" r="5" fill="url(#orb)"/>
<circle cx="1120" cy="230" r="3" fill="url(#orb)"/>
<circle cx="770" cy="60" r="3" fill="url(#orb)"/>
<circle cx="820" cy="300" r="4" fill="url(#orb)"/>

<!-- EMF radar circles top-left of figure area -->
<g stroke="#39ffb0" stroke-opacity="0.25" fill="none" stroke-width="1.5">
<circle cx="960" cy="180" r="60"/>
<circle cx="960" cy="180" r="100"/>
<circle cx="960" cy="180" r="140"/>
</g>
<line x1="960" y1="180" x2="1060" y2="130" stroke="#39ffb0" stroke-opacity="0.5" stroke-width="2"/>

<!-- crack/warning accent lines near headline -->
<path d="M60,40 L95,40 L80,70 L110,70" fill="none" stroke="#ff4d4d" stroke-opacity="0.35" stroke-width="2"/>

<!-- small ghost hunting equipment icon: spirit box waveform -->
<g transform="translate(60,255)" opacity="0.55">
<polyline points="0,10 15,10 20,-10 30,25 40,-15 50,10 65,10" fill="none" stroke="#7fffd4" stroke-width="2"/>
</g>

<!-- vignette overlay -->
<rect x="0" y="0" width="1200" height="360" fill="url(#vignette)"/>

<!-- Headline -->
<text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="#eafffa" textLength="820" lengthAdjust="spacingAndGlyphs">
Phasmophobia Exploit
</text>

<!-- subtle glow duplicate for headline -->
<text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="#39ffb0" opacity="0.18" textLength="820" lengthAdjust="spacingAndGlyphs">
Phasmophobia Exploit
</text>

<!-- Tagline -->
<text x="62" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#a8d8cf" textLength="760" lengthAdjust="spacingAndGlyphs">
Exploit ghost detection mechanics in Phasmophobia
</text>
<text x="62" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#a8d8cf" textLength="560" lengthAdjust="spacingAndGlyphs">
for unfair investigation advantages
</text>

</svg>